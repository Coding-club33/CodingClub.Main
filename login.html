<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles/login.css">
  <link rel="shortcut icon" type="x-icon" href="img/logo.png">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>





  <div class="wrapper">
    <a href="index.html">
      <button class="back"><span class="material-symbols-outlined">
          arrow_back
        </span></button></a>

    <img class="loginlogo" src="img/loginlogored.jpg" alt="Coding Club Logo">
    <h1>Login</h1>
    <p id="error-message"></p>
    <form id="form">
      <div>
        <label for="email-input">
          <span>@</span>
        </label>
        <input type="email" name="email" id="email-input" placeholder="Email">
      </div>
      <div>
        <label for="password-input">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
            <path
              d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z" />
          </svg>
        </label>
        <input type="password" name="password" id="password-input" placeholder="Password">
      </div>
      <button type="submit">Login</button>
    </form>
    <!-- <p>New here? <a href="signup.html">Create an Account</a></p> -->
  </div>


  <script>
    const form = document.getElementById('form');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const errorMessage = document.getElementById('error-message');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const emailDiv = emailInput.parentElement;
      const passwordDiv = passwordInput.parentElement;

      // Reset state
      emailDiv.classList.remove('incorrect');
      passwordDiv.classList.remove('incorrect');
      errorMessage.textContent = '';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email) {
        emailDiv.classList.add('incorrect');
        errorMessage.textContent = 'Please enter your email.';
        return;
      }
      if (!password) {
        passwordDiv.classList.add('incorrect');
        errorMessage.textContent = 'Please enter your password.';
        return;
      }

      // TODO: Replace with actual authentication logic
      errorMessage.style.color = '#f06272';
      errorMessage.textContent = 'Login coming soon. Stay tuned!';
    });
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XP0STPVBLX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-XP0STPVBLX');
  </script>
</body>

</html>
